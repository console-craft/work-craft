name: Diagnose supervisor

on:
  push:
    branches: [diagnose/test-supervisor]

permissions:
  contents: read

jobs:
  supervisor:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compare process inspection syntax without exposing environments
        run: |
          bun -e '
            const format = "pid=,ppid=,lstart=,command=";
            for (const options of [["-axo", format], ["eww", "-axo", format], ["eww", "axo", format]]) {
              const result = Bun.spawnSync(["ps", ...options], {
                env: { ...process.env, LC_ALL: "C" }, timeout: 1000, maxBuffer: 16 * 1024 * 1024,
              });
              console.log(JSON.stringify({ options, exitCode: result.exitCode, signalCode: result.signalCode, stderr: result.stderr.toString() }));
            }
          '
      - name: Exercise existing supervisor contracts
        run: bun test ./scripts/run-bounded.test.ts

  acceptance-comparison:
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, supervised]
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Record test-process signals without changing their behavior
        run: |
          mkdir -p .superpowers
          cat > .superpowers/trace-kill.ts <<'EOF'
          const kill = process.kill.bind(process);
          process.kill = function (pid, signal) {
            if (signal !== 0) {
              console.error("test-process signal", JSON.stringify({ sender: process.pid, target: pid, signal }));
            }
            return kill(pid, signal);
          };
          console.error("test-process started", process.pid);
          EOF
      - name: Prepare exact acceptance selection
        run: |
          cat > .superpowers/compare-acceptance.ts <<'EOF'
          import { discoverTests, partitionTests } from "../scripts/test-gates.ts";
          import { runBounded } from "../scripts/run-bounded.ts";
          const paths = partitionTests(await discoverTests()).acceptance.map(path => `./${path}`);
          const command = [process.execPath, "test", "--preload", "./.superpowers/trace-kill.ts", ...paths];
          console.error("acceptance comparison", process.argv[2], JSON.stringify(paths));
          const code = process.argv[2] === "supervised"
            ? await runBounded(command, 300000)
            : await Bun.spawn(command, { stdin: "inherit", stdout: "inherit", stderr: "inherit" }).exited;
          console.error("acceptance comparison exit", code);
          process.exitCode = code;
          EOF
      - name: Execute acceptance comparison
        run: /usr/bin/time -l bun .superpowers/compare-acceptance.ts ${{ matrix.mode }}
