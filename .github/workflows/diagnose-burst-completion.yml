name: Diagnose burst completion

on:
  push:
    branches: [diagnose/burst-completion]

permissions:
  contents: read

jobs:
  trace:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Trace one acceptance run without changing its deadlines
        env:
          WORK_CRAFT_BURST_TRACE: "1"
        run: |
          set -o pipefail
          bun run test:acceptance 2>&1 | tee "$RUNNER_TEMP/burst-acceptance.log"
      - name: Preserve the diagnostic log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burst-acceptance-macos
          path: ${{ runner.temp }}/burst-acceptance.log
          if-no-files-found: error
