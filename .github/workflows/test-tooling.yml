name: Test tooling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "packages/*/package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "scripts/**"
      - "src/preview*.ts"
      - "packages/server/src/terminal/**"
      - "packages/server/src/api/terminal-*.ts"
      - "packages/tui/src/tests/**"
      - "packages/tui/src/workbench/**"
      - "packages/tui/src/shell/layout.ts"
      - "packages/tui/src/ui/renderer.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "packages/*/package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "scripts/**"
      - "src/preview*.ts"
      - "packages/server/src/terminal/**"
      - "packages/server/src/api/terminal-*.ts"
      - "packages/tui/src/tests/**"
      - "packages/tui/src/workbench/**"
      - "packages/tui/src/shell/layout.ts"
      - "packages/tui/src/ui/renderer.ts"

permissions:
  contents: read

jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:tooling
